services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docs-rag-postgres
    environment:
      POSTGRES_USER: docsrag
      POSTGRES_PASSWORD: docsrag_local_dev
      POSTGRES_DB: docsrag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsrag -d docsrag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: